<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZIYOKOR NONLARI — GPS P2P Marketplace</title>
<script src="gun/gun.js"></script>
<link rel="stylesheet" href="lib/leaflet.css" />
<script src="lib/leaflet.js"></script>
<script>if(typeof L==='undefined'){document.write('<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>')}</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --glass:rgba(255,255,255,0.05);
  --glass-border:rgba(255,255,255,0.08);
  --text:#f0ece6;
  --text-dim:rgba(240,236,230,0.5);
  --text-bright:#fff;
  --gold:#d4a574;
  --gold-light:#e8c9a6;
  --gold-dim:rgba(212,165,116,0.3);
  --accent:#e86a3a;
  --green:#4caf50;
  --blue:#42a5f5;
  --purple:#ab47bc;
  --orange:#ffa726;
  --red:#ff6b6b;
  --bg:#0a0806;
  --card:rgba(255,255,255,0.04);
  --radius:16px;
  --transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.5;min-height:100dvh;padding-bottom:90px}
::selection{background:var(--gold);color:#000}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:4px}

.btn{padding:10px 22px;border-radius:100px;border:none;font-size:0.8rem;font-weight:600;cursor:pointer;transition:var(--transition);font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,#b8854a,var(--gold));color:#fff}
.btn-primary:hover{opacity:0.9;transform:translateY(-1px)}
.btn-ghost{background:var(--glass);border:1px solid var(--glass-border);color:var(--text-dim)}
.btn-ghost:hover{color:var(--text);border-color:var(--gold)}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:rgba(255,107,107,0.15);color:var(--red);border:1px solid rgba(255,107,107,0.3)}
.btn-sm{padding:6px 14px;font-size:0.7rem}
.btn:active{transform:scale(0.97)}

.card{background:var(--card);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;backdrop-filter:blur(8px);transition:var(--transition)}
.card:hover{border-color:rgba(255,255,255,0.12)}
input,select,textarea{background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;color:var(--text);padding:10px 14px;font-size:0.85rem;outline:none;width:100%;font-family:inherit;transition:var(--transition)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
select option{background:#0a0806}
label{font-size:0.75rem;color:var(--text-dim);margin-bottom:4px;display:block}

.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(10,8,6,0.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--glass-border);position:sticky;top:0;z-index:1000}
.nav-logo{font-size:0.95rem;font-weight:700;color:var(--text-bright);display:flex;align-items:center;gap:8px}
.nav-logo span{color:var(--gold)}
.nav-info{display:flex;align-items:center;gap:10px;font-size:0.7rem;color:var(--text-dim)}

.tab-bar{display:flex;background:rgba(255,255,255,0.02);border-bottom:1px solid var(--glass-border);position:sticky;top:48px;z-index:999;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{padding:10px 16px;font-size:0.72rem;font-weight:500;color:var(--text-dim);background:none;border:none;cursor:pointer;white-space:nowrap;font-family:inherit;border-bottom:2px solid transparent;transition:var(--transition);flex-shrink:0}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}

.content{padding:16px;max-width:1000px;margin:0 auto;animation:fadeUp 0.35s ease}
.section-title{font-size:1.15rem;font-weight:700;color:var(--text-bright);margin-bottom:4px}
.section-sub{color:var(--text-dim);font-size:0.75rem;margin-bottom:16px}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty-state .icon{font-size:3.5rem;display:block;margin-bottom:12px;opacity:0.35}
.empty-state p{font-size:0.85rem;margin-bottom:6px}
.empty-state .hint{font-size:0.68rem;opacity:0.6}

.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.prod-card{background:var(--card);border:1px solid var(--glass-border);border-radius:12px;overflow:hidden;cursor:pointer;transition:var(--transition)}
.prod-card:hover{transform:translateY(-3px);border-color:var(--gold-dim)}
.prod-name{font-size:0.82rem;font-weight:600;color:var(--text-bright);margin-top:6px}
.prod-price{font-size:0.9rem;font-weight:700;color:var(--gold)}
.prod-price sub{font-size:0.55rem;color:var(--text-dim);font-weight:400}

.badge{font-size:0.6rem;padding:3px 10px;border-radius:100px;font-weight:600;display:inline-block}
.badge-gold{background:rgba(212,165,116,0.9);color:#fff}
.badge-accent{background:rgba(232,106,58,0.9);color:#fff}
.badge-green{background:rgba(100,200,100,0.9);color:#fff}
.badge-blue{background:rgba(100,180,255,0.9);color:#fff}

.status-badge{font-size:0.6rem;padding:3px 10px;border-radius:100px;font-weight:600;display:inline-block}
.status-pending{background:rgba(255,193,7,0.15);color:#ffc107}
.status-accepted{background:rgba(66,165,245,0.15);color:var(--blue)}
.status-baking{background:rgba(212,165,116,0.15);color:var(--gold)}
.status-ready{background:rgba(76,175,80,0.15);color:var(--green)}
.status-delivering{background:rgba(255,167,38,0.15);color:var(--orange)}
.status-delivered{background:rgba(76,175,80,0.25);color:#81c784}
.status-rejected{background:rgba(255,107,107,0.15);color:var(--red)}

.modal-overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.7);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s}
.modal-overlay.active{opacity:1;pointer-events:all}
.modal{background:rgba(16,12,8,0.97);border:1px solid var(--glass-border);border-radius:20px;max-width:460px;width:90vw;padding:24px;max-height:85vh;overflow-y:auto;transform:scale(0.92) translateY(20px);transition:transform 0.35s cubic-bezier(0.16,1,0.3,1)}
.modal-overlay.active .modal{transform:scale(1) translateY(0)}

.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(16,12,8,0.95);border:1px solid var(--glass-border);backdrop-filter:blur(20px);color:var(--text);border-radius:12px;padding:12px 22px;font-size:0.82rem;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,0.5);display:none;max-width:90vw;text-align:center;line-height:1.4}
.toast.show{display:block;animation:fadeIn 0.3s ease}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-40px,60px) scale(1.1)}66%{transform:translate(40px,-30px) scale(0.95)}}

#map{width:100%;height:55vh;border-radius:var(--radius);overflow:hidden;border:1px solid var(--glass-border)}
.leaflet-container{background:#0a0806!important}
.leaflet-control-zoom a{background:rgba(16,12,8,0.92)!important;color:var(--text)!important;border-color:var(--glass-border)!important}
.leaflet-popup-content-wrapper{background:rgba(16,12,8,0.96)!important;color:var(--text)!important;border:1px solid var(--glass-border)!important;border-radius:12px!important}
.leaflet-popup-tip{background:rgba(16,12,8,0.96)!important}
.leaflet-popup-content{margin:10px 14px!important;font-size:0.8rem!important;font-family:'Inter',sans-serif!important}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--glass-border);border-radius:12px;padding:14px;text-align:center;transition:var(--transition)}
.stat-card:hover{border-color:var(--gold-dim)}
.stat-num{font-size:1.3rem;font-weight:700;color:var(--gold)}
.stat-label{font-size:0.63rem;color:var(--text-dim);margin-top:2px}

.gps-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(76,175,80,0.08);border:1px solid rgba(76,175,80,0.2);border-radius:10px;font-size:0.68rem;color:var(--green);margin-bottom:12px}
.gps-bar.off{background:rgba(255,107,107,0.08);border-color:rgba(255,107,107,0.2);color:var(--red)}
.gps-bar .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;flex-shrink:0}
.gps-bar.off .pulse{background:#666;animation:none}

.legend-row{display:flex;align-items:center;gap:8px;font-size:0.68rem;color:var(--text-dim);margin-bottom:4px}
.legend-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.legend-dot.seller{background:var(--gold)}
.legend-dot.customer{background:var(--blue)}
.legend-dot.delivery{background:var(--purple)}
.legend-dot.me{background:var(--green)}

.login-card{background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:24px;padding:40px 36px;max-width:400px;width:90vw;text-align:center;backdrop-filter:blur(16px)}
.login-title{font-size:1.8rem;font-weight:800;color:var(--text-bright);margin-bottom:4px}
.login-title span{color:var(--gold)}
.login-sub{color:var(--text-dim);font-size:0.82rem;margin-bottom:24px}

.order-card{border-left:3px solid var(--glass-border);margin-bottom:10px}
.order-card.pending{border-left-color:var(--gold)}
.order-card.delivering{border-left-color:var(--orange)}
.order-card.delivered{border-left-color:var(--green)}
.order-card.rejected{border-left-color:var(--red)}

@media(max-width:480px){
  .login-card{padding:28px 20px}
  .grid-3{grid-template-columns:repeat(2,1fr)}
  .content{padding:12px}
  .modal{padding:18px;width:95vw}
}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-logo">ZIYOKOR <span>NONLARI</span></div>
  <div class="nav-info">
    <span id="statusDot" style="width:6px;height:6px;border-radius:50%;background:#666;flex-shrink:0"></span>
    <span id="peerStatus">ulanish...</span>
  </div>
</div>

<div class="tab-bar" id="tabBar"></div>

<div class="content" id="app"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// ZIYOKOR NONLARI v3.0 — GPS P2P Marketplace
// Combined: Customer · Seller · Driver · Admin
// Tech: Gun.js P2P · Leaflet GPS · REST API
// ============================================================

const IS_CAPACITOR = !!(window.Capacitor && window.Capacitor.isNativePlatform());
const GUN_RELAY = IS_CAPACITOR ? null : (window.location.origin + '/gun');

// ====== GUN INIT ======
const gun = Gun({ peers: GUN_RELAY ? [GUN_RELAY] : [], localStorage: true, radisk: true });

// ====== STATE ======
if (!localStorage.getItem('zn_uid')) {
  localStorage.setItem('zn_uid', 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,8));
}
const UID = localStorage.getItem('zn_uid');
let peerCount = 0;
let role = null, name = '', phone = '', bakeryName = '', vehicle = 'velo';
let currentTab = 0;
let cart = {}, selectedBakeryId = null;
let myLat = null, myLng = null, gpsWatchId = null, gpsActive = false, mapInitialized = false;
let mapInstance = null, mapMarkers = {}, deliveryLines = {};
let bakeries = {}, orders = {}, myOrders = {}, liveLocations = {};

// Chat state
let chatContact = null, chatMessages = {}, chatUnread = {}, chatOpen = false;

// ====== PRODUCT DATA ======
const DEFAULT_PRODUCTS = [
  {id:1,name:'Oq non',price:5000,cat:'tandir',desc:'Klassik oq non',badge:'Arzon'},
  {id:2,name:'Tandir noni',price:8000,cat:'tandir',desc:'An\'anaviy tandirda pishgan',badge:'🔥 Best'},
  {id:3,name:'Patir non',price:10000,cat:'tandir',desc:'Qatlamli yog\'li patir',badge:''},
  {id:4,name:'Kulcha non',price:5000,cat:'tandir',desc:'Kichik yumaloq kulcha',badge:'Arzon'},
  {id:5,name:'Samarqand noni',price:20000,cat:'premium',desc:'Mashhur Samarqand noni',badge:'⭐ Premium'},
  {id:6,name:'Buxoro noni',price:18000,cat:'premium',desc:'Buxorocha maxsus retsept',badge:'⭐ Premium'},
  {id:7,name:'Farg\'ona noni',price:8000,cat:'tandir',desc:'Farg\'ona usulida pishgan',badge:''},
  {id:8,name:'Qora non',price:7000,cat:'sog-lom',desc:'Kepakli foydali qora non',badge:'🌿 Organik'},
  {id:9,name:'Zog\'ora non',price:6000,cat:'sog-lom',desc:'Makkajo\'xori unidan',badge:'🌿 Organik'},
  {id:10,name:'Yupqa non',price:5000,cat:'tandir',desc:'Yupqa yoyilgan tez non',badge:'Arzon'},
  {id:11,name:'Qalin non',price:7000,cat:'tandir',desc:'Qalin yumshoq non',badge:''},
  {id:12,name:'Suzma non',price:7000,cat:'tandir',desc:'Suzma qo\'shilgan',badge:''},
  {id:13,name:'Qatiqli non',price:8000,cat:'qandol',desc:'Nordonmaza non',badge:''},
  {id:14,name:'Yog\'li non',price:10000,cat:'qandol',desc:'Sariyog\' qo\'shilgan',badge:''},
  {id:15,name:'Pishloqli non',price:12000,cat:'qandol',desc:'Erigan pishloqli',badge:'🆕 Yangi'},
  {id:16,name:'Go\'shtli non',price:25000,cat:'maxsus',desc:'Go\'sht bilan to\'ldirilgan',badge:'🔥 Best'},
  {id:17,name:'Tuxumli non',price:10000,cat:'qandol',desc:'Tuxum qo\'shilgan',badge:''},
  {id:18,name:'Ziravorli non',price:8000,cat:'maxsus',desc:'Ziravorlar bilan',badge:''},
  {id:19,name:'Kunjutli non',price:8000,cat:'tandir',desc:'Kunjut urug\'lari bilan',badge:'🆕 Yangi'},
  {id:20,name:'Qovoqli non',price:9000,cat:'sog-lom',desc:'Qovoq pyuresi bilan',badge:'🆕 Yangi'},
  {id:21,name:'Kartoshkali non',price:8000,cat:'maxsus',desc:'Kartoshka qo\'shilgan',badge:''},
  {id:22,name:'Piyozli non',price:7000,cat:'maxsus',desc:'Piyoz bilan xushbo\'y',badge:''},
  {id:23,name:'Ko\'k noni',price:8000,cat:'sog-lom',desc:'Ko\'katlar bilan',badge:'🌿 Organik'},
  {id:24,name:'Asalli non',price:15000,cat:'qandol',desc:'Asal qo\'shilgan shirin',badge:'🆕 Yangi'},
  {id:25,name:'Mayizli non',price:12000,cat:'qandol',desc:'Mayiz bilan shirin',badge:''},
  {id:26,name:'Yong\'oqli non',price:20000,cat:'premium',desc:'Yong\'oq bilan',badge:'⭐ Premium'},
  {id:27,name:'Bodomli non',price:25000,cat:'premium',desc:'Bodom uni bilan',badge:'⭐ Premium'},
  {id:28,name:'Non to\'plami',price:30000,cat:'maxsus',desc:'5 xil non turidan',badge:'🔥 Best'},
  {id:29,name:'Bayram noni',price:25000,cat:'premium',desc:'Bayramlar uchun',badge:'⭐ Premium'},
  {id:30,name:'Maxsus non',price:30000,cat:'maxsus',desc:'Exclusive retsept',badge:'⭐ Premium'},
];

// ====== PEER TRACKING ======
gun.on('hi', p => { peerCount = Object.keys(Gun.peers||{}).length + 1; updatePeerUI(); });
gun.on('bye', p => { peerCount = Object.keys(Gun.peers||{}).length; updatePeerUI(); });

function updatePeerUI() {
  const dot = document.getElementById('statusDot');
  const st = document.getElementById('peerStatus');
  const online = peerCount > 0;
  dot.style.background = online ? '#4caf50' : '#666';
  dot.style.boxShadow = online ? '0 0 6px rgba(76,175,80,0.5)' : 'none';
  st.textContent = online ? `${peerCount} peer(s)` : 'offline';
  st.style.color = online ? '#4caf50' : 'var(--text-dim)';
}

// ====== GPS ======
function startGps() {
  if (gpsWatchId !== null) return;
  if (!navigator.geolocation) { toast('⚠️ Brauzer GPS ni qo\'llab-quvvatlamaydi'); return; }
  gpsWatchId = navigator.geolocation.watchPosition(pos => {
    myLat = pos.coords.latitude; myLng = pos.coords.longitude; gpsActive = true;
    gun.get('locations').get(UID).put({ lat: myLat, lng: myLng, role, name, bakery: bakeryName, online: true, updatedAt: Date.now() });
    if (role === 'seller') gun.get('bakeries').get(UID).get('location').put({ lat: myLat, lng: myLng });
    renderGpsBar();
  }, err => { gpsActive = false; renderGpsBar(); }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 3000 });
}

function stopGps() {
  if (gpsWatchId !== null) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
  gpsActive = false;
  gun.get('locations').get(UID).put({ online: false, updatedAt: Date.now() });
  renderGpsBar();
}

function renderGpsBar() {
  const el = document.getElementById('gpsBar');
  if (!el || !role) return;
  if (gpsActive && myLat && myLng) {
    el.className = 'gps-bar';
    el.innerHTML = `<span class="pulse"></span><span>📍 ${myLat.toFixed(5)}, ${myLng.toFixed(5)}</span><span style="margin-left:auto;font-size:0.6rem;opacity:0.6">${myLat.toFixed(2)}°N, ${myLng.toFixed(2)}°E</span>`;
  } else {
    el.className = 'gps-bar off';
    el.innerHTML = `<span class="pulse"></span><span>📍 GPS: ${gpsWatchId!==null?'kutilyapti...':'faol emas'}</span><button class="btn btn-sm btn-ghost" style="margin-left:auto;padding:2px 10px;font-size:0.6rem" onclick="startGps()">Yoqish</button>`;
  }
}

// ====== LIVE LOCATIONS ======
function subscribeLocations() {
  gun.get('locations').map().on((loc, id) => {
    if (loc && loc.lat && loc.lng) liveLocations[id] = { ...loc, id };
  });
}

// ====== CHAT ======
function chatRoomId(peerId) { return [UID, peerId].sort().join('_'); }

function subscribeChats() {
  gun.get('chat_messages').map().on((msgs, roomId) => {
    if (!roomId || !roomId.includes(UID) || !msgs) return;
    const list = Object.values(msgs).filter(m => m && m.t);
    chatMessages[roomId] = list.sort((a,b) => (a.t||0) - (b.t||0));
    if (chatOpen) renderChat();
    updateChatBadge();
  });
}

function openChat(peerId, peerName) {
  chatContact = { id: peerId, name: peerName || 'Foydalanuvchi' };
  chatOpen = true;
  chatUnread[chatRoomId(peerId)] = 0;
  showModal(chatModalHtml());
  renderChat();
}

function chatModalHtml() {
  if (!chatContact) return '<div class="empty-state"><span class="icon">💬</span><p>Foydalanuvchi tanlanmagan</p></div>';
  const room = chatRoomId(chatContact.id);
  const msgs = chatMessages[room] || [];
  const otherLoc = liveLocations[chatContact.id];
  const online = otherLoc?.online ? '🟢 Online' : '🔴 Offline';
  return `
    <div style="display:flex;flex-direction:column;height:60vh">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div>
          <div style="font-weight:600;color:var(--text-bright);font-size:0.9rem">💬 ${chatContact.name}</div>
          <div style="font-size:0.6rem;color:var(--text-dim)">${online}</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="closeChat()">✕</button>
      </div>
      <div id="chatMessages" style="flex:1;overflow-y:auto;padding:10px;background:var(--glass);border-radius:var(--radius);margin-bottom:8px;display:flex;flex-direction:column;gap:6px">
        ${msgs.length === 0 ? '<div style="text-align:center;padding:20px;color:var(--text-dim);font-size:0.75rem">Xabarlar yo\'q</div>' : msgs.map(m => {
          const isMe = m.f === UID;
          const time = m.t ? new Date(m.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '';
          let content = escHtml(m.text||'');
          if (m.type === 'image') content = `<img src="${m.data}" style="max-width:200px;border-radius:8px;cursor:pointer" onclick="window.open('${m.data}','_blank')" />`;
          if (m.type === 'video') content = `<video src="${m.data}" controls style="max-width:200px;border-radius:8px"></video>`;
          return `<div style="display:flex;flex-direction:column;align-items:${isMe?'flex-end':'flex-start'}">
            <div style="background:${isMe?'var(--gold)':'var(--card)'};color:${isMe?'#000':'var(--text)'};padding:8px 12px;border-radius:12px;font-size:0.78rem;max-width:80%;word-break:break-word">${content}</div>
            <div style="font-size:0.5rem;color:var(--text-dim);margin-top:2px">${time}</div>
          </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="attachImage()" style="font-size:1.1rem;padding:8px 10px">📷</button>
        <input id="chatInput" style="flex:1" placeholder="Xabar yozing..." onkeydown="if(event.key==='Enter')sendMessage()" />
        <button class="btn btn-primary" onclick="sendMessage()" style="padding:8px 16px">➤</button>
      </div>
    </div>`;
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input?.value?.trim();
  if (!text || !chatContact) return;
  input.value = '';
  const room = chatRoomId(chatContact.id);
  const msgId = 'msg_' + Date.now().toString(36) + Math.random().toString(36).slice(2,4);
  gun.get('chat_messages').get(room).get(msgId).put({ f: UID, t: Date.now(), text, type: 'text' });
}

function attachImage() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*,video/*';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 500000) { toast('⚠️ Fayl juda katta (max 500KB)'); return; }
    const reader = new FileReader();
    reader.onload = ev => {
      const room = chatRoomId(chatContact.id);
      const msgId = 'msg_' + Date.now().toString(36) + Math.random().toString(36).slice(2,4);
      gun.get('chat_messages').get(room).get(msgId).put({ f: UID, t: Date.now(), text: file.name, type: file.type.startsWith('video/')?'video':'image', data: ev.target.result });
      toast('📷 Yuborildi');
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function renderChat() {
  const container = document.getElementById('chatMessages');
  if (!container || !chatContact) return;
  const room = chatRoomId(chatContact.id);
  container.innerHTML = (chatMessages[room]||[]).map(m => {
    const isMe = m.f === UID;
    const time = m.t ? new Date(m.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '';
    let content = escHtml(m.text||'');
    if (m.type === 'image') content = `<img src="${m.data}" style="max-width:200px;border-radius:8px;cursor:pointer" onclick="window.open('${m.data}','_blank')" />`;
    if (m.type === 'video') content = `<video src="${m.data}" controls style="max-width:200px;border-radius:8px"></video>`;
    return `<div style="display:flex;flex-direction:column;align-items:${isMe?'flex-end':'flex-start'}">
      <div style="background:${isMe?'var(--gold)':'var(--card)'};color:${isMe?'#000':'var(--text)'};padding:8px 12px;border-radius:12px;font-size:0.78rem;max-width:80%;word-break:break-word">${content}</div>
      <div style="font-size:0.5rem;color:var(--text-dim);margin-top:2px">${time}</div>
    </div>`;
  }).join('');
  container.scrollTop = container.scrollHeight;
}

function closeChat() { chatOpen = false; chatContact = null; closeModal(); }

function allContacts() {
  const c = [];
  Object.entries(liveLocations).forEach(([id, loc]) => {
    if (id === UID) return;
    c.push({ id, name: loc.role==='seller'?'🏪 '+(loc.bakery||loc.name):loc.role==='delivery'?'🚚 '+loc.name:'🛒 '+loc.name, role: loc.role, online: loc.online });
  });
  Object.entries(bakeries).forEach(([id, b]) => {
    if (id !== UID && !c.find(x => x.id === id)) c.push({ id, name: '🏪 '+(b.name||b.owner), role: 'seller', online: b.online });
  });
  return c;
}

function showChatContacts() {
  const contacts = allContacts();
  if (!contacts.length) { toast('💬 Tarmoqda foydalanuvchi yo\'q'); return; }
  showModal(`
    <div style="min-height:40vh">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="font-weight:600;color:var(--text-bright)">💬 Xabarlar</span>
        <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
      </div>
      ${contacts.map(c => {
        const unread = chatUnread[chatRoomId(c.id)]||0;
        return `<div class="card bakery-item" style="cursor:pointer;margin-bottom:6px;padding:12px 14px" onclick="closeModal();openChat('${c.id}','${escJs(c.name)}')">
          <div class="bakery-icon" style="font-size:1.2rem">${c.online?'🟢':'🔴'}</div>
          <div class="bakery-info"><div class="bakery-name">${c.name}</div><div class="bakery-detail" style="font-size:0.62rem">${c.online?'Online':'Offline'}${unread?` · <span style="color:var(--gold);font-weight:600">${unread} ta</span>`:''}</div></div>
          <span style="font-size:1.2rem">💬</span>
        </div>`;
      }).join('')}
    </div>`);
}

function updateChatBadge() {
  const fab = document.getElementById('chatFab');
  if (!fab) return;
  const total = Object.values(chatUnread).reduce((s,v) => s+v, 0);

function login() {
  const r = document.getElementById('loginRole').value;
  const n = document.getElementById('loginName').value.trim();
  const p = document.getElementById('loginPhone').value.trim();
  const b = document.getElementById('loginBakery')?.value?.trim() || '';
  const v = document.getElementById('loginVehicle')?.value || 'velo';
  if (!n || !p) { toast('⚠️ Ism va telefon majburiy'); return; }
  if (r === 'seller' && !b) { toast('⚠️ Nonvoyxona nomini kiriting'); return; }
  role = r; name = n; phone = p; bakeryName = b; vehicle = v;
  subscribeLocations();
  subscribeChats();
  if (r === 'seller') initSeller();
  else if (r === 'customer') initCustomer();
  else if (r === 'delivery') initDelivery();
  else initAdmin();
  startGps();
  initTabs();
  render();
}

// ====== ROLE INIT ======
function initSeller() {
  gun.get('bakeries').get(UID).put({ id: UID, name: bakeryName, owner: name, phone, status: 'open', joinedAt: Date.now(), online: true, role: 'seller' });
  gun.get('orders').map().on((order, orderId) => {
    if (order && order.bakeryId === UID) { orders[orderId] = { ...order, id: orderId }; myOrders[orderId] = { ...order, id: orderId }; render(); if (order.status === 'pending') toast(`🆕 #${orderId.slice(-5)} yangi buyurtma`); }
  });
  toast(`🏪 ${bakeryName} tarmoqqa qo'shildi`);
}

function initCustomer() {
  gun.get('bakeries').map().on((bakery, id) => {
    if (bakery && bakery.name) { bakeries[id] = { ...bakery, id }; if (bakery.products) bakeries[id].products = bakery.products; render(); }
  });
  gun.get('orders').map().on((order, orderId) => {
    if (order && order.customerId === UID) { orders[orderId] = { ...order, id: orderId }; myOrders[orderId] = { ...order, id: orderId }; render(); }
  });
}

function initDelivery() {
  gun.get('delivery').get(UID).put({ id: UID, name, phone, vehicle, online: true, busy: false });
  gun.get('orders').map().on((order, orderId) => {
    if (order) {
      if (order.deliveryId === UID || order.status === 'ready' || order.status === 'delivering') { myOrders[orderId] = { ...order, id: orderId }; orders[orderId] = { ...order, id: orderId }; render(); }
    }
  });
  toast(`🚚 ${name} yetkazish tarmog'iga qo'shildi`);
}

function initAdmin() {
  gun.get('bakeries').map().on((bakery, id) => { if (bakery && bakery.name) { bakeries[id] = { ...bakery, id }; render(); } });
  gun.get('orders').map().on((order, orderId) => { if (order) { orders[orderId] = { ...order, id: orderId }; render(); } });
  toast('⚙️ Admin paneliga xush kelibsiz');
}

// ====== TABS ======
function initTabs() {
  const tabs = role === 'seller' ? ['📊', '🍞', '📦', '🗺', '⚙️'] :
    role === 'customer' ? ['🍞', '📍', '📦', '🗺', '⚙️'] :
    role === 'delivery' ? ['📦', '🗺', '📍', '⚙️'] :
    ['📊', '👥', '🗺', '⚙️'];
  const labels = role === 'seller' ? ['Dashboard', 'Nonlarim', 'Buyurtmalar', 'Xarita', 'Sozlamalar'] :
    role === 'customer' ? ['Nonlar', 'Nonvoyxona', 'Buyurtmalar', 'Xarita', 'Sozlamalar'] :
    role === 'delivery' ? ['Buyurtmalar', 'Xarita', 'Mening joyim', 'Sozlamalar'] :
    ['Monitor', 'Foydalanuvchilar', 'Xarita', 'Sozlamalar'];
  const bar = document.getElementById('tabBar');
  bar.innerHTML = tabs.map((t,i) => `<button class="tab-btn ${i===0?'active':''}" onclick="switchTab(${i})" title="${labels[i]}">${t}</button>`).join('');
}

function switchTab(idx) {
  currentTab = idx;
  document.querySelectorAll('.tab-btn').forEach((t,i) => t.classList.toggle('active', i === idx));
  render();
}

// ====== RENDER ======
function render() {
  if (!role) return showLogin();
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (role === 'seller') {
    if (currentTab === 0) app.innerHTML = sellerDashboard();
    else if (currentTab === 1) app.innerHTML = sellerProducts();
    else if (currentTab === 2) app.innerHTML = sellerOrders();
    else if (currentTab === 3) app.innerHTML = mapView();
    else if (currentTab === 4) app.innerHTML = settingsView();
  } else if (role === 'customer') {
    if (currentTab === 0) app.innerHTML = customerProducts();
    else if (currentTab === 1) app.innerHTML = customerBakeries();
    else if (currentTab === 2) app.innerHTML = customerOrders();
    else if (currentTab === 3) app.innerHTML = mapView();
    else if (currentTab === 4) app.innerHTML = settingsView();
  } else if (role === 'delivery') {
    if (currentTab === 0) app.innerHTML = deliveryOrders();
    else if (currentTab === 1) app.innerHTML = mapView();
    else if (currentTab === 2) app.innerHTML = deliveryMyLocation();
    else if (currentTab === 3) app.innerHTML = settingsView();
  } else {
    if (currentTab === 0) app.innerHTML = adminMonitor();
    else if (currentTab === 1) app.innerHTML = adminUsers();
    else if (currentTab === 2) app.innerHTML = mapView();
    else if (currentTab === 3) app.innerHTML = settingsView();
  }
  // Inject GPS bar
  if (!document.getElementById('gpsBar') && role) {
    const firstEl = app.querySelector('.section-title, .card, .stats-grid');
    if (firstEl) {
      const bar = document.createElement('div'); bar.id = 'gpsBar'; bar.className = 'gps-bar off';
      bar.innerHTML = '<span class="pulse"></span><span>📍 GPS faol emas</span>';
      firstEl.parentNode.insertBefore(bar, firstEl);
      renderGpsBar();
    }
  }
}

      ${deliveryFolks.slice(0,3).map(d => `<button class="btn btn-sm btn-ghost" style="padding:2px 10px;font-size:0.6rem" onclick="openChat('${d.id}','🚚 ${escJs(d.name)}')">💬 ${d.name}</button>`).join('')}

  const items = (o.items||[]).map(i => `${i.name||i.productName} x${i.qty||i.quantity}`).join(', ');
  const statusMap = { pending:'🟡 Kutilmoqda', accepted:'🔵 Qabul qilindi', baking:'🟠 Tayyorlanmoqda', ready:'✅ Tayyor', delivering:'🟢 Yetkazilmoqda', delivered:'✅ Yetkazildi', rejected:'🔴 Bekor qilindi' };
  const actions = {
    pending: `<button class="btn btn-success btn-sm" onclick="updateOrder('${o.id}','accepted')">✅ Qabul qilish</button><button class="btn btn-danger btn-sm" onclick="updateOrder('${o.id}','rejected')">❌ Rad etish</button>`,
    accepted: `<button class="btn btn-primary btn-sm" onclick="updateOrder('${o.id}','baking')">🔥 Tayyorlanmoqda</button>`,
    baking: `<button class="btn btn-primary btn-sm" onclick="updateOrder('${o.id}','ready')">✅ Tayyor</button>`,
    ready: `<span style="font-size:0.7rem;color:var(--gold)">✅ Tayyor · Yetkazuvchi kutilmoqda</span>`,
    delivering: `<span style="font-size:0.72rem;color:var(--green)">🚚 ${o.deliveryName || 'Yetkazilmoqda'}</span>`,
    delivered: `<span style="font-size:0.72rem;color:var(--green)">✅ Yetkazildi</span>`,
    rejected: `<span style="font-size:0.72rem;color:var(--red)">❌ Bekor qilindi</span>`,
  };
  const customerLoc = liveLocations[o.customerId];
  const deliveryLoc = liveLocations[o.deliveryId];
  return `<div class="card order-card ${o.status}" style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;margin-bottom:4px">
      <span style="font-size:0.65rem;color:var(--text-dim)">#${o.id.slice(-5)} · ${o.customerName||'Xaridor'}</span>
      <span class="status-badge status-${o.status}">${statusMap[o.status]||o.status}</span>
    </div>
    <div style="font-size:0.8rem;color:var(--text);margin-bottom:4px">${items||'—'}</div>
    <div style="font-size:0.78rem;font-weight:600;color:var(--gold);margin-bottom:4px">${(o.total||0).toLocaleString()} so'm</div>
    <div style="font-size:0.65rem;color:var(--text-dim);margin-bottom:4px">📍 ${o.address||'—'} · 📞 ${o.customerPhone||'—'}</div>
    ${customerLoc?`<div style="font-size:0.62rem;color:var(--blue);margin-bottom:4px">🛒 ${customerLoc.lat?.toFixed(4)}, ${customerLoc.lng?.toFixed(4)}</div>`:''}
    ${deliveryLoc?`<div style="font-size:0.62rem;color:var(--purple);margin-bottom:4px">🚚 ${deliveryLoc.lat?.toFixed(4)}, ${deliveryLoc.lng?.toFixed(4)}</div>`:''}

      ${o.deliveryId?`<button class="btn btn-sm btn-ghost" style="padding:2px 8px;font-size:0.6rem" onclick="openChat('${o.deliveryId}','🚚 ${escJs(o.deliveryName||'Yetkazuvchi')}')">💬 Yetkazuvchi</button>`:''}
    </div>
    ${showActions && actions[o.status] ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${actions[o.status]}</div>` : ''}
  </div>`;
}

function updateOrder(orderId, status) {
  const order = orders[orderId] || myOrders[orderId];
  if (!order) return;
  order.status = status;
  gun.get('orders').get(orderId).get('status').put(status);
  render();
  const msgs = { accepted:'✅ Buyurtma qabul qilindi', rejected:'❌ Rad etildi', baking:'🟠 Tayyorlanmoqda', ready:'✅ Tayyor' };
  toast(msgs[status]||status);
}

function addProduct() {
  const name = prompt('Non nomi:'); if (!name) return;

  const prods = bakeries[UID]?.products || [];
  prods.push({ id: Date.now(), name, price, desc: '' });
  gun.get('bakeries').get(UID).get('products').put(prods);
  toast(`✅ ${name} qo'shildi`);
  render();
}

function removeProduct(id) {
  let prods = bakeries[UID]?.products || [];
  prods = prods.filter(p => p.id !== id);
  gun.get('bakeries').get(UID).get('products').put(prods);
  render();
}

// ====== CART ======
function addToCart(bakeryId, bakeryName, productId, productName, price) {
  selectedBakeryId = bakeryId;
  if (cart[productId]) cart[productId].qty++;
  else cart[productId] = { id: productId, name: productName, price, qty: 1, bakeryId, bakeryName };
  updateCartFab();
  toast(`✅ ${productName} savatga qo'shildi`);
}

function updateCartFab() {
  const count = Object.values(cart).reduce((s,i) => s + i.qty, 0);
  const fab = document.getElementById('cartFab');
  if (fab) {
    const b = fab.querySelector('.badge');
    if (b) b.textContent = count;
    if (count === 0) fab.remove();
  }
}

function showCart() {
  const items = Object.values(cart);
  if (!items.length) { toast('⚠️ Savat bo\'sh'); return; }
  const total = items.reduce((s,i) => s + i.price * i.qty, 0);
  showModal(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="font-size:1.1rem;font-weight:600;color:var(--text-bright)">🛒 Savat</span>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
    </div>
    ${items.map(i => `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--glass-border);font-size:0.82rem">
      <span>${i.name} <span style="color:var(--text-dim);font-size:0.7rem">x${i.qty}</span></span>
      <span style="color:var(--gold);font-weight:600">${(i.price*i.qty).toLocaleString()} so'm</span>
    </div>`).join('')}
    <div style="display:flex;justify-content:space-between;font-size:0.9rem;font-weight:700;color:var(--gold);padding:10px 0">
      <span>Jami</span><span>${total.toLocaleString()} so'm</span>
    </div>
    <label style="margin-top:8px">Yetkazish manzili</label>
    <textarea id="orderAddress" rows="2" style="margin-top:4px;min-height:50px" placeholder="Manzilni kiriting"></textarea>
    <div style="font-size:0.62rem;color:var(--text-dim);margin-top:4px">📍 GPS joylashuv avtomatik yuboriladi</div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:12px" onclick="confirmOrder()">📦 Buyurtma berish</button>
  `);
}

function confirmOrder() {
  const address = document.getElementById('orderAddress')?.value?.trim();
  if (!address) { toast('⚠️ Manzilni kiriting'); return; }
  const items = Object.values(cart);
  const total = items.reduce((s,i) => s + i.price * i.qty, 0);
  const orderId = 'ord_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  const order = {
    id: orderId, bakeryId: selectedBakeryId||items[0]?.bakeryId||'unknown',
    bakeryName: items[0]?.bakeryName||'Nonvoy', customerId: UID, customerName: name,
    customerPhone: phone, customerLat: myLat, customerLng: myLng,
    items: items.map(i => ({ productId: i.id, name: i.name, qty: i.qty, price: i.price })),
    total, address, status: 'pending', createdAt: Date.now(),
  };
  gun.get('orders').get(orderId).put(order);
  if (order.bakeryId) gun.get('bakeries').get(order.bakeryId).get('orders').get(orderId).put(order);
  myOrders[orderId] = { ...order, id: orderId };
  orders[orderId] = { ...order, id: orderId };
  cart = {}; selectedBakeryId = null; updateCartFab();
  closeModal();
  toast('🎉 Buyurtma qabul qilindi!');
  render();
}

      <div class="legend-row"><span class="legend-dot me"></span> Siz</div>
    </div>
    <div id="map"></div>
    <div id="mapPeers" style="margin-top:6px;font-size:0.62rem;color:var(--text-dim)"></div>

function initMap() {
  if (mapInstance) { mapInstance.invalidateSize(); updateMapMarkers(); return; }
  const container = document.getElementById('map');
  if (!container || container._leaflet_id) return;
  const pos = myLat&&myLng ? [myLat, myLng] : [41.2995, 69.2401];
  mapInstance = L.map('map', { center: pos, zoom: 13, zoomControl: true, attributionControl: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapInstance);
  mapInitialized = true;
  updateMapMarkers();
}

function updateMapMarkers() {
  if (!mapInstance) return;
  const activeIds = new Set(Object.keys(liveLocations)); activeIds.add(UID);
  Object.keys(mapMarkers).forEach(id => { if (!activeIds.has(id)) { mapInstance.removeLayer(mapMarkers[id]); delete mapMarkers[id]; } });
  if (myLat && myLng) updateMarker(UID, myLat, myLng, 'me', name);
  Object.values(liveLocations).forEach(loc => { if (loc.id !== UID && loc.online) updateMarker(loc.id, loc.lat, loc.lng, loc.role, loc.name); });
  // Delivery route lines
  Object.values(myOrders).forEach(o => {
    if ((o.status === 'delivering'||o.status==='ready') && o.deliveryId && liveLocations[o.deliveryId]) {
      const delLoc = liveLocations[o.deliveryId];
      const customerLoc = o.customerLat&&o.customerLng ? [o.customerLat, o.customerLng] : null;
      const bakeryLoc = bakeries[o.bakeryId]?.location;
      if (deliveryLines[o.id]) mapInstance.removeLayer(deliveryLines[o.id]);
      const pts = [];
      if (bakeryLoc) pts.push([bakeryLoc.lat, bakeryLoc.lng]);
      if (delLoc.lat&&delLoc.lng) pts.push([delLoc.lat, delLoc.lng]);
      if (customerLoc) pts.push(customerLoc);
      if (pts.length >= 2) deliveryLines[o.id] = L.polyline(pts, { color: '#ffa726', weight: 3, opacity: 0.7, dashArray: '8,8' }).addTo(mapInstance);
    }
  });
  // Update peer count
  const peerEl = document.getElementById('mapPeers');
  if (peerEl) {
    const r = { seller: 0, customer: 0, delivery: 0 };
    Object.values(liveLocations).forEach(l => { if (l.online && l.role) r[l.role]++; });
    peerEl.innerHTML = `🏪 ${r.seller} · 🛒 ${r.customer} · 🚚 ${r.delivery} · 📡 ${Object.keys(mapMarkers).length} marker`;
  }
}

function updateMarker(id, lat, lng, mRole, mName) {
  const isMe = id === UID;
  const colors = { seller: '#d4a574', customer: '#42a5f5', delivery: '#ab47bc', me: '#4caf50' };
  const c = isMe ? colors.me : (colors[mRole]||'#666');
  const label = isMe ? `${name} (siz)` : `${mName||'User'} ${mRole==='delivery'?'🚚':mRole==='seller'?'🏪':'🛒'}`;
  const icon = L.divIcon({
    html: `<div style="background:${c};width:${isMe?18:14}px;height:${isMe?18:14}px;border-radius:50%;border:3px solid rgba(255,255,255,0.8);box-shadow:0 2px 8px rgba(0,0,0,0.5);transition:all 0.3s"></div>`,
    iconSize: isMe ? [18,18] : [14,14], iconAnchor: isMe ? [9,9] : [7,7], className: ''
  });
  if (mapMarkers[id]) { mapMarkers[id].setLatLng([lat, lng]); }
  else { mapMarkers[id] = L.marker([lat, lng], { icon }).bindPopup(`<b>${label}</b>`).addTo(mapInstance); }
}

  if (mapInstance && myLat && myLng) mapInstance.setView([myLat, myLng], 14);

// ====== UTILS ======
function calcDist(lat1, lng1, lat2, lng2) {
  const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
}

function emptyState(icon, title, desc) {
  return `<div class="empty-state"><span class="icon">${icon}</span><p>${title}</p><p class="hint">${desc}</p></div>`;
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escJs(s) { return (s||'').replace(/'/g, "\\'"); }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

function showModal(html) {

}

function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
